<script>
// ---- the hand: every stroked shape in an ink or pencil layer becomes a line a person drew ----
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const NS = 'http://www.w3.org/2000/svg';
function wob(n){ const p = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28]; return t => Math.sin(t / 26 + p[0]) * .6 + Math.sin(t / 9.5 + p[1]) * .3 + Math.sin(t / 4.1 + p[2]) * .1 }
function handPath(el, closed){
  const L = el.getTotalLength(), j = +(el.closest('[data-j]')?.dataset.j || 0.9), f = wob();
  const step = 3, start = closed ? rnd() * L : 0, total = closed ? L * (1.04 + rnd() * .05) : L, ext = closed ? 0 : 2.5 + rnd() * 2;
  const pts = [];
  for (let s = -ext; s <= total + ext; s += step) {
    const u = closed ? (start + s) % L : Math.min(Math.max(s, 0), L);
    const p = el.getPointAtLength(u), q = el.getPointAtLength(Math.min(L, u + .5)), r0 = el.getPointAtLength(Math.max(0, u - .5));
    let tx = q.x - r0.x, ty = q.y - r0.y; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    let x = p.x, y = p.y;
    if (!closed && s < 0) { x += tx * s; y += ty * s } if (!closed && s > L) { x += tx * (s - L); y += ty * (s - L) }
    const o = f(s) * j; pts.push([x - ty * o, y + tx * o]);
  }
  return 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
}

  if (t === 'rect') { const x = +el.getAttribute('x') || 0, y = +el.getAttribute('y') || 0, w = +el.getAttribute('width'), h = +el.getAttribute('height');
    return [[`M${x} ${y} H${x + w}`, 0], [`M${x + w} ${y} V${y + h}`, 0], [`M${x + w} ${y + h} H${x}`, 0], [`M${x} ${y + h} V${y}`, 0]] }
  if (t === 'line') return [[`M${el.getAttribute('x1')} ${el.getAttribute('y1')} L${el.getAttribute('x2')} ${el.getAttribute('y2')}`, 0]];
  if (t === 'circle' || t === 'ellipse') { const cx = +el.getAttribute('cx'), cy = +el.getAttribute('cy'), rx = +(el.getAttribute('r') || el.getAttribute('rx')), ry = +(el.getAttribute('r') || el.getAttribute('ry'));
