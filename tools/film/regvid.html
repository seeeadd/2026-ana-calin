<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Exit Plan · registration video</title>
<!-- Ana's real opt-in video on our painted world. One edit, two shapes; every frame is render(t).
       desktop  1560 x 1008 (the page window's 1.548:1)    W=1560 H=1008 FILM=regvid.html
       phone    1080 x 1920 (portrait), ?v=p               W=1080 H=1920 FILM="regvid.html?v=p"
     Sky: her own sky turned into a two-colour wash. Sea and wall: painted. Ana stays in her gold frame, or shrinks to a
     small one for cut-aways. Captions are her real words, straight on the scene, no paper behind them.
     Frames and timed words live in _local/ (not in git). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@600;700;800&family=Nothing+You+Could+Do&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#FFF8EE}
:root{--ink:#1A1412;--pink:#F72585;--serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--hand:'Nothing You Could Do',cursive}
#film{position:relative;overflow:hidden;font-family:var(--sans);color:var(--ink);background:#FFF8EE}
#sky{position:absolute;left:0;top:0;display:block}
#world{position:absolute;inset:0;z-index:2}
.sc{position:absolute;z-index:2;max-width:none}
#paper{position:absolute;inset:0;z-index:3;pointer-events:none;background:url(tex/paper-cream.webp) 0 0/100% auto;mix-blend-mode:multiply;opacity:.42}
.title{position:absolute;z-index:9;font-family:var(--serif);line-height:1.02;letter-spacing:-.012em;color:var(--ink);text-shadow:0 0 22px rgba(255,248,238,.8)}
.title i{color:var(--pink);font-style:italic}
.title .ln{display:block;white-space:nowrap}
.title b{font-weight:400;background:linear-gradient(transparent 58%,rgba(255,212,0,.62) 58% 92%,transparent 92%);padding:0 .06em}
.day{position:absolute;z-index:5}
.day>span{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);line-height:1;color:var(--ink)}
.stampmark{position:absolute;z-index:6;transform-origin:50% 50%}
.stampmark img{position:absolute;inset:0;width:100%;height:100%}
.stampmark span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-weight:800;letter-spacing:.34em;padding-left:.34em;color:#A5121A}
#thread{position:absolute;inset:0;z-index:5;overflow:visible;pointer-events:none}
#sign{position:absolute;z-index:4;transform-origin:50% 100%}
#sign svg{position:absolute;inset:0;overflow:visible}
#sign img{position:absolute;left:0;top:0;width:100%}
#sign span{position:absolute;left:22%;width:72%;font-family:var(--serif);line-height:1;color:var(--ink);text-align:center}
#wallsvg{position:absolute;inset:0;z-index:7}
.env{position:absolute;z-index:9;left:0;top:0;opacity:0}
#cnote{position:absolute;left:0;top:0;z-index:9;opacity:0}
#cnote img{position:absolute;inset:0;width:100%;height:100%}
#cnote span{position:absolute;left:8%;right:8%;top:22%;text-align:center;font-family:var(--serif);line-height:1;color:var(--ink)}
#cnote svg{position:absolute;inset:0;overflow:visible}
#bud-wrap{position:absolute;inset:0;z-index:10;pointer-events:none}
#ana{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;filter:drop-shadow(0 18px 20px rgba(58,44,30,.28))}
#ana .fr{position:absolute;inset:0;border:0 solid transparent}
#vb{position:absolute;left:0;top:0;overflow:hidden;background:#D9E4EC}
#vb img{position:absolute;left:0;top:0;width:100%;height:100%;display:block;transform-origin:50% 42%}
#ov{position:absolute;left:0;top:0;z-index:14;opacity:0}
#ov img{position:absolute;left:0;top:0;width:100%}
/* captions: her words on the scene. Bold ink with a soft cream glow; key words get the soft yellow */
#cap{position:absolute;z-index:20;pointer-events:none}
#capP{display:block;font-family:var(--sans);font-weight:800;line-height:1.13;letter-spacing:-.022em;color:var(--ink);text-wrap:balance;
  text-shadow:0 0 2px rgba(255,248,238,1),0 0 10px rgba(255,248,238,.98),0 0 24px rgba(255,248,238,.92),0 0 44px rgba(255,248,238,.7)}
#capP span{display:inline-block;white-space:pre}
#capP span.h{background:linear-gradient(transparent 14%,rgba(255,212,0,.62) 14% 90%,transparent 90%);margin:0 -.04em;padding:0 .04em}
#grain{position:absolute;inset:0;z-index:30;pointer-events:none;background:url(../../img/vip/paint/tx-grain.webp) 0 0/100% auto;mix-blend-mode:multiply;opacity:.14}
</style>
</head>

  function runner(t){
    var x = rx(t), v = (rx(t + .02) - rx(t - .02)) / .04, sp = Math.abs(v), fast = L.W * .115;
    var runs = t < 3.7 ? 1 : t < 4.7 ? 1 - seg(t, 3.7, 4.7) : clamp(sp / fast, 0, 1);
    var backward = t > 11.55 && t < 14.9;
    var ph = t * (backward ? 20 : 16), o = {x: x, lp: backward ? -ph : ph, la: 38 * runs, j: Math.abs(Math.sin(ph)) * 13 * runs, sq: 1};
    o.r = (t < 4.7 ? 7 * runs : v > 0 ? 8 * runs : -9 * runs) + Math.sin(t * 1.3) * 1.2 * (1 - runs);
    o.al = lerp(14, 40, runs); o.ar = lerp(14, 40, runs);
    /* free: a small jump, arms up */
    var c1 = hop(t, 7.0, .55, 58); if (c1 > 0) { o.j += c1; o.al = o.ar = 150 }
    if (t > 7.0 && t < 7.3) o.sq = 1 - (1 - seg(t, 7.0, 7.3)) * .08;
    /* looks up at the title */
    if (t > 7.3 && t < 8.7) o.ht = -9 * io(seg(t, 7.3, 7.7));
    /* turning at the sign: anticipation before he runs backward */
    if (t > 11.0 && t < 11.55) { var p = seg(t, 11.0, 11.55); o.r = -4 * Math.sin(p * Math.PI); o.sq = 1 + Math.sin(p * Math.PI) * .03 }
    /* proof lands: he jumps */
    var c2 = hop(t, 16.95, .5, 66); if (c2 > 0) { o.j += c2; o.al = o.ar = 155 }
    /* envelopes blow away: he shrugs */
    if (t > 23.6 && t < 25.0) { var q = Math.sin(seg(t, 23.6, 25.0) * Math.PI); o.al = lerp(14, 72, q); o.ar = lerp(14, 72, q); o.ht = 5 * q }
    /* a small cheer on "know" */
    var c3 = hop(t, 28.0, .55, 48); if (c3 > 0) { o.j += c3; o.al = o.ar = 150 }
    pose('bud', o);
  }

  /* ---------- Ana: main shot (her video big, graphics on top), framed, or small in a cut-away ---------- */
  function main(t){ return 1 - io(seg(t, 8.6, 9.28)) + io(seg(t, 25.88, 26.46)) }
  function ana(t){
    var f = track([[0, L.FB], [17.10, L.FB], [17.86, L.FA], [40, L.FA]], t), m = main(t);
    var arcB = Math.sin(seg(t, 17.10, 17.86) * Math.PI), y = f[1] + arcB * 22;
    /* a swing from the hook after each move */
    var sw = 0; if (t > 9.1) sw += Math.sin((t - 9.1) * 7) * 1.5 * Math.exp(-(t - 9.1) * 2.6); if (t > 17.7) sw += Math.sin((t - 17.7) * 6) * 1.1 * Math.exp(-(t - 17.7) * 2.8);
    /* the frame drops onto her from above, and lifts off the same way */
    var off = m * (L.H + 260), hx = L.box[0] / 2;
    a.style.visibility = m >= .999 ? 'hidden' : 'visible';
    a.style.transformOrigin = hx + 'px 0';
    a.style.transform = 'translate(' + (f[0] + hx * f[2] - hx).toFixed(2) + 'px,' + (y - off).toFixed(2) + 'px) rotate(' + sw.toFixed(3) + 'deg) scale(' + f[2].toFixed(4) + ')';
    /* her video grows from the frame's opening to the main shot */
    var R0 = [f[0] + L.ins[0] * f[2], y + L.ins[1] * f[2], L.ins[2] * f[2], L.ins[3] * f[2]], V = R0.map(function(v, i){ return lerp(v, L.M[i], m) });
    vb.style.left = V[0].toFixed(2) + 'px'; vb.style.top = V[1].toFixed(2) + 'px'; vb.style.width = V[2].toFixed(2) + 'px'; vb.style.height = V[3].toFixed(2) + 'px';
    vb.style.transformOrigin = (f[0] + hx * f[2] - V[0]).toFixed(1) + 'px ' + (y - V[1]).toFixed(1) + 'px';
    vb.style.transform = 'rotate(' + (sw * (1 - m)).toFixed(3) + 'deg)';
    var tn = $('torn'); tn.style.display = PHONE || m < .02 ? 'none' : 'block'; tn.style.opacity = clamp(m * 2.5, 0, 1).toFixed(3); tn.style.left = (V[0] - 36).toFixed(1) + 'px';
    /* on the phone the wall comes up in front of her for the main shot; on desktop it runs behind her */
    var dy = (L.wallM - L.capT) * m, tf = 'translateY(' + dy.toFixed(1) + 'px)';
    $('wallsvg').style.transform = tf; $('bud-wrap').style.transform = tf;
    /* a slow push-in inside each shot */
    var sh = t < 8.66 ? t / 8.66 : t < 17.3 ? (t - 8.66) / 8.64 : t < 25.9 ? (t - 17.3) / 8.6 : (t - 25.9) / 4.2;
    /* landscape: closer on her, less sky, and the crop follows her face */
    if (PHONE) { $('vid').style.transform = 'scale(' + (1 + sh * .03).toFixed(4) + ')' }
    else {
      var zoom = 1.14 * (1 + sh * .03), seen = 835 / zoom, fc = window.FACE[Math.min(Math.floor(t * 30), window.FACE.length - 1)];
      var top = clamp(fc - seen * .47, 0, 835 - seen);
      $('vid').style.transformOrigin = '50% 0'; $('vid').style.transform = 'translateY(' + (-top / 835 * zoom * 100).toFixed(3) + '%) scale(' + zoom.toFixed(4) + ')';
    }
    /* a graphic on top of her video: the tag lands on "free", swings, and leaves */
    var A1 = seg(t, 5.86, 6.42), O1 = seg(t, 7.2, 7.62);
    if (A1 <= 0 || O1 >= 1) ovl.style.opacity = 0;
    else {
      var q = outq(A1), ox = L.ov[0] - (1 - q) * L.ov[2] * 1.2 - O1 * O1 * L.ov[2] * 1.6, oy = L.ov[1] - Math.sin(A1 * Math.PI) * 40 - O1 * 60, or = -7 + (1 - q) * -26 + (t > 6.42 ? Math.sin((t - 6.42) * 6) * 2.4 * Math.exp(-(t - 6.42) * 2.4) : 0) - O1 * O1 * 30;
      ovl.style.opacity = 1; ovl.style.transform = 'translate(' + ox.toFixed(1) + 'px,' + oy.toFixed(1) + 'px) rotate(' + or.toFixed(2) + 'deg)';
    }
  }

  /* titles write on left to right, and wipe off the same way */
  function title(id, t, a0, d, b){
    var e = $(id), ln = e.querySelectorAll('.ln');
    if (t < a0 - .01 || t > b + .4) { e.style.visibility = 'hidden'; return }
    e.style.visibility = 'visible';
    ln.forEach(function(l, i){
      var inP = a0 === 0 ? 1 : io(seg(t, a0 + i * d, a0 + (i + 1) * d)), outP = io(seg(t, b, b + .36));
      l.style.clipPath = 'inset(-20% ' + ((1 - inP) * 103).toFixed(2) + '% -30% ' + (outP * 103).toFixed(2) + '%)';
    });
  }

  /* the three days rise as she says them; the sign comes up as he reaches it */
  function days(t){
    var out = io(seg(t, 17.05, 17.6)), hh = L.day[1] + 40;
    [['d1', 9.3, -3.2], ['d2', 9.82, 2.2], ['d3', 10.26, -1.6]].forEach(function(d){
      var r = rise(t, d[1], .62), e = $(d[0]);
      e.style.visibility = r <= 0 || out >= 1 ? 'hidden' : 'visible';
      var press = Math.sin(seg(t, 16.34, 16.62) * Math.PI) * 8;
      e.style.transform = 'translateY(' + (((1 - r) * hh + out * hh + press).toFixed(1)) + 'px) rotate(' + d[2] + 'deg)';
    });
    var sr = rise(t, 10.5, .6);
    sg.style.visibility = sr <= 0 || out >= 1 ? 'hidden' : 'visible';
    var sway = t > 11 ? Math.sin((t - 11) * 5) * 3.2 * Math.exp(-(t - 11) * 1.4) : 0;
    if (t > 12.85) sway += Math.sin((t - 12.85) * 6) * 2.2 * Math.exp(-(t - 12.85) * 2);
    var dropS = L.capT - L.sign[1] + 40;
    sg.style.transform = 'translateY(' + ((1 - sr) * dropS + out * dropS).toFixed(1) + 'px) rotate(' + (sway * (PHONE ? .4 : 1)).toFixed(2) + 'deg)';
    /* the words on the tag write as she says them */
    $('signT').style.clipPath = 'inset(-10% ' + ((1 - io(seg(t, 12.9, 13.55))) * 103).toFixed(1) + '% -10% 0)';
    /* the arrow paints itself from the income back to Day 1, just ahead of him */
    var Lt = amP.getTotalLength(), pr = io(seg(t, 11.65, 14.5)), gone = t >= 17.3, arH = $('arH');
    amP.style.strokeDasharray = Lt + ' ' + (Lt + 20); amP.style.strokeDashoffset = (Lt * (1 - pr)).toFixed(1);
    arw.style.visibility = arH.style.visibility = pr > 0 && !gone ? 'visible' : 'hidden';
    var q0 = amP.getPointAtLength(Lt * pr), q1 = amP.getPointAtLength(Math.max(0, Lt * pr - 3)), q2 = pr < .002 ? amP.getPointAtLength(3) : q0, q3 = pr < .002 ? amP.getPointAtLength(0) : q1;
    var ang = Math.atan2(q2.y - q3.y, q2.x - q3.x) * 180 / Math.PI, hw = L.head, hh2 = hw * 150 / 140;
    arH.setAttribute('width', hw); arH.setAttribute('height', hh2);
    arH.setAttribute('transform', 'translate(' + q0.x.toFixed(1) + ' ' + q0.y.toFixed(1) + ') rotate(' + ang.toFixed(2) + ') translate(' + (-hw * .16).toFixed(1) + ' ' + (-hh2 * .5).toFixed(1) + ')');
    /* the arrow leaves with the row */
    $('thread').style.transform = 'translateY(' + (out * hh).toFixed(1) + 'px)';
    /* the proof stamp: hovers, presses on the word, settles */
    var press2 = seg(t, 16.12, 16.36);
    if (t < 16.12) pmEl.style.opacity = 0;
    else { pmEl.style.opacity = t < 16.36 ? lerp(0, .55, press2) : 1; var sc = t < 16.36 ? lerp(1.16, 1, inq(press2)) : 1 + Math.sin(seg(t, 16.36, 16.62) * Math.PI) * -.012; pmEl.style.transform = 'translateY(' + (out * hh).toFixed(1) + 'px) rotate(-2deg) scale(' + sc.toFixed(3) + ')' }
  }

  /* envelopes land for "an audience", the wind takes them on "without one" */
  var envs = Array.prototype.slice.call(document.querySelectorAll('.env'));
  envs.forEach(function(e){ e.style.width = L.envW + 'px' });
  var eh = L.envW * .86, ES = [[0, 0, -5], [118, 0, 4], [58, -18, -2], [20, -38, 7], [92, -54, -6]];
  var cnote = $('cnote'), nw = 240 * L.k; cnote.style.width = nw + 'px'; cnote.style.height = (197 * L.k) + 'px'; cnote.querySelector('span').style.fontSize = (62 * L.k) + 'px';
  function envelopes(t){
    envs.forEach(function(e, i){
      var E = 19.55 + i * .15, G = 22.85 + (4 - i) * .07, p = seg(t, E - .55, E), g = seg(t, G, G + 1.05);
      if (p <= 0 || g >= 1) { e.style.opacity = 0; return }
      var S = ES[i], q = outq(p), X = L.env + S[0] * L.k, Y = L.capT - eh + 10 + S[1] * L.k;
      var sx = X + (i % 2 ? 150 : -120) * (1 - q), sy = lerp(Y - 420, Y, q * q), rot = S[2] + (1 - q) * (i % 2 ? 40 : -34);
      var gg = g * g; sx += -gg * (L.W * .75 + i * 80) + Math.sin(g * 5 + i) * 26 * g; sy += -Math.sin(g * Math.PI * .62) * (300 + i * 40) - gg * 90; rot += gg * (i % 2 ? -210 : 170);
      e.style.opacity = 1; e.style.transform = 'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
    });
    var A2 = seg(t, 24.0, 24.55), G2 = seg(t, 25.95, 26.85);
    if (A2 <= 0 || G2 >= 1) cnote.style.opacity = 0;
    else {
      var q2 = outq(A2), nh = 197 * L.k, ny0 = L.capT - nh + 6, nx = L.noteX + (1 - q2) * 130 - G2 * G2 * (L.W * .6), ny = lerp(ny0 - 360, ny0, q2 * q2) - Math.sin(G2 * Math.PI * .6) * 340, nr = 5 - (1 - q2) * 24 + G2 * G2 * 150;
      cnote.style.opacity = 1; cnote.style.transform = 'translate(' + nx.toFixed(1) + 'px,' + ny.toFixed(1) + 'px) rotate(' + nr.toFixed(2) + 'deg)';
    }
    var st = $('strike'), Ls = st.getTotalLength(); st.style.strokeDasharray = Ls; st.style.strokeDashoffset = (Ls * (1 - io(seg(t, 25.2, 25.55)))).toFixed(1);
  }

  /* ---------- captions: the whole thought is readable, each word inks in as she says it ---------- */
  var capP = $('capP'), cap = $('cap'), capCur = -1, CAPS = window.CAPS;
  function captions(t){
    var k = -1; for (var i = 0; i < CAPS.length; i++) if (t >= CAPS[i].t0 - .001 && t < CAPS[i].t1 + .001) k = i;
    if (k !== capCur) { capCur = k; capP.innerHTML = k < 0 ? '' : CAPS[k].w.map(function(w, i, A){ var nx = A[i + 1]; return w.h && nx && nx.h ? '<span class="h">' + w.x + ' </span>' : '<span class="' + (w.h ? 'h' : '') + '">' + w.x + '</span> ' }).join('') }
    if (k < 0) { capP.style.opacity = 0; return }
    var c = CAPS[k], sp = capP.querySelectorAll('span'), P = t < 8.66 || t >= 25.9 ? L.cM : t < 17.3 ? L.cB : L.cA;
    cap.style.left = P.x + 'px'; cap.style.top = P.y + 'px'; cap.style.width = P.w + 'px'; capP.style.fontSize = P.fs + 'px'; capP.style.textAlign = P.align;
    capP.style.opacity = c.t0 < .01 ? 1 : PHONE && t < 9.3 && t > 8.66 ? io(seg(t, 9.02, 9.2)) : io(seg(t, c.t0 - .02, c.t0 + .1));
    c.w.forEach(function(w, i){ var p = c.t0 < .01 ? 1 : seg(t, w.t - .05, w.t + .16); sp[i].style.opacity = lerp(.55, 1, p).toFixed(3) });
  }

  /* her frames: exact, one image per frame of the cut */
  var vid = $('vid'), sky = $('sky'), lastF = -1;
  function pad(n){ return ('0000' + n).slice(-5) }
  function frames(t){
    var f = Math.min(Math.floor(t * 30 + 1e-6), 901) + 1;
    if (f === lastF) return Promise.resolve();
    lastF = f;
    vid.src = '_local/f/' + pad(f) + '.jpg'; sky.src = '_local/' + (PHONE ? 'b2/' : 'b/') + pad(f) + '.jpg';
    return Promise.all([vid.decode(), sky.decode()]);
  }

  window.DUR = window.DUR || 30;
  window.render = function(t){
    t = clamp(t, 0, window.DUR);
    var d = dist(t);
    $('capT').setAttribute('transform', 'translate(' + (-(d % 400)).toFixed(1) + ' 0)');
    $('land').style.transform = 'translateX(' + (-d * .09).toFixed(1) + 'px)';
    /* light on the water: two layers of white strokes, drifting apart and trading places */
    var sh = Math.sin(t * 1.5);
    $('g1').style.transform = 'translateX(' + (-t * 7 - d * .22).toFixed(1) + 'px)'; $('g1').style.opacity = (.6 + .4 * sh).toFixed(3);
    $('g2').style.transform = 'translateX(' + (t * 6 - d * .22).toFixed(1) + 'px) scaleX(-1)'; $('g2').style.opacity = (.6 - .4 * sh).toFixed(3);
    title('t1', t, 0, 0, 7.0);
    title('t2', t, 7.42, .72, 8.5);
    title('t3', t, 25.98, .78, 99);
    days(t); envelopes(t); runner(t); ana(t); captions(t);
    return frames(t);
  };

  fetch('../../exit-number/').then(function(r){ return r.text() }).then(function(txt){
    var m = txt.match(/<symbol id="sf" viewBox="-60 -60 120 120">([\s\S]*?)<\/symbol>/); var SF = m ? m[1] : '';
    document.querySelectorAll('[data-sf]').forEach(function(g){ g.innerHTML = SF });
    var imgs = Array.prototype.slice.call(document.images);
    return Promise.all(imgs.map(function(im){ return im.complete ? 0 : new Promise(function(r){ im.onload = im.onerror = r }) }));
  }).then(function(){ return document.fonts.ready }).then(function(){ return window.render(+(new URLSearchParams(location.search).get('t') || 0)) }).then(function(){ document.body.setAttribute('data-ready', '1') });
})();
</script>
