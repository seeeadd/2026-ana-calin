#wash{position:absolute;inset:0;z-index:4;background:#FFF8EE;opacity:0}
#wallsvg{position:absolute;inset:0;z-index:7;overflow:visible}
#sigh{filter:drop-shadow(0 0 5px #FFF8EE) drop-shadow(0 0 12px #FFF8EE)}
#sheet{position:absolute;inset:0;z-index:9;background:#FFF8EE;opacity:0}
#vb{position:absolute;left:0;top:0;overflow:hidden;background:#D9E4EC}

#ana{position:absolute;left:0;top:0}

#torn{position:absolute;top:0;width:90px;height:1008px;z-index:13}
#bud-wrap{position:absolute;inset:0;z-index:10;pointer-events:none}
#thread{position:absolute;inset:0;z-index:11;overflow:visible;pointer-events:none}
.pc{position:absolute;left:0;top:0;z-index:10;opacity:0;visibility:hidden}

.pc.under{z-index:6}
.pc.top{z-index:15}

.big i{color:var(--pink);font-style:italic}
.big .ln{display:block}
.phone .big{text-align:center}
.phone .dm.col{flex-direction:column;align-items:flex-start;gap:.7em;width:auto;padding-left:.8em}
mark{color:inherit;background:linear-gradient(transparent 52%,rgba(255,212,0,.62) 52% 94%,transparent 94%);padding:0 .05em}
/* struck lists */
.strk{position:relative;display:inline-block;font-family:var(--serif);color:var(--ink);text-shadow:0 0 18px rgba(255,248,238,.9)}
.strk svg{position:absolute;left:-3%;top:34%;width:106%;height:44%;overflow:visible}
.strk path{fill:none;stroke:var(--pink);stroke-width:7;stroke-linecap:round;vector-effect:non-scaling-stroke}

.rowb{white-space:nowrap;display:flex;align-items:center;gap:.5em;background:var(--cream);border:2.4px solid #E6D8C4;border-radius:.45em;padding:.36em .62em;font-weight:800;letter-spacing:-.015em;box-shadow:0 12px 26px -16px rgba(70,45,25,.45)}
.rowb .tk{flex:none;width:1em;height:1em;border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center}
.rowb .tk svg{width:62%;height:62%;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rowb.lit{background:#fff;border-color:var(--pink);color:var(--ink)}
.rowb.lit .tk{background:var(--sun)}

.dm{display:flex;align-items:center;justify-content:center;gap:1.1em;width:100%}
.dm-s{display:flex;align-items:center;gap:.5em;opacity:.36}
.dm-c{position:relative;flex:none;width:2em;height:2em;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.dm-c svg{position:absolute;inset:18%;display:none}
.dm-t{display:flex;flex-direction:column;line-height:1.1}
.dm-t small{font-size:.62em;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.dm-t b{font-weight:700;white-space:nowrap}
.dm-s.cur{opacity:1}
.dm-s.cur .dm-c{background:var(--pink);border-color:var(--pink);color:#fff;transform:scale(1.25)}
.dm-s.cur .dm-t small{color:var(--pink)}
.dm-s.cur .dm-t b{font-family:var(--serif);font-weight:400;font-size:1.9em}
.dm-s.done{opacity:.9}
.dm-s.done .dm-c{background:var(--ink)}
.dm-s.done .dm-c b{display:none}
.dm-s.done .dm-c svg{display:block}
.statc{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:12px 18px;box-shadow:0 14px 26px -18px rgba(40,25,10,.6)}

.shadowp{filter:drop-shadow(0 18px 24px rgba(58,44,30,.28))}
.lbl{font-weight:600;color:var(--ink3);line-height:1.25}
.fc{display:flex;justify-content:center}
.fc img{width:1em;height:1em;border-radius:50%;border:4px solid #fff;margin-left:-.18em;box-shadow:0 8px 16px -8px rgba(40,25,10,.5)}

#capP{display:block;font-weight:800;line-height:1.13;letter-spacing:-.022em;color:var(--ink);text-wrap:balance;
