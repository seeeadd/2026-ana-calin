<title>The Exit Plan · registration film</title>
<!-- The registration film (Nov 1, 2026), about 2.5 minutes, every frame a function of time: render(t).
     Story (the video script, with the registration page's facts, no event dates):
       0:00 running in place (the wheel)          0:09 the usual order (the tower wobbles)
       0:17 Ana's room in Greece: $1.4M, about 80,000 readers, 0 sales calls, about two hours a day
       0:37 the two-sale workshop                 0:47 771 likes and nothing, 82 likes and money
       1:01 the order changes: the tower falls, Day 1 to 3, the door to 2027
       1:20 The Exit Plan, each day as a live session with the teaser slides and Ana's camera
       1:58 results from the past challenge       2:10 the exit number, the five 1:1s       2:21 save your free seat
     Ana's camera is a still from her own Shorts until her video arrives (swap .cam img for a <video>).
     tools/film/render.js renders it (set FILM=film.html). -->

<script>
(function(){

  function el(tag, a, parent){ var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); (parent || cam).appendChild(e); return e }

  /* ---------- easing and keyframes: everything glides, nothing pops ---------- */
  var clamp = function(x, a, b){ return Math.max(a, Math.min(b, x)) };

    ease = ease || io;
    if (t <= keys[0][0]) return keys[0][1];

      var k0 = keys[i], k1 = keys[i + 1];
      if (t <= k1[0]) { var p = ease((t - k0[0]) / (k1[0] - k0[0])); return Array.isArray(k0[1]) ? k0[1].map(function(v, j){ return lerp(v, k1[1][j], p) }) : lerp(k0[1], k1[1], p) }

  /* the sunflower, with ink legs */
