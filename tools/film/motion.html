<title>The Exit Plan · motion test</title>
<!-- Motion test (Nov 1, 2026): the story told with action, almost no words.
     Running in place (the sunflower in a wheel, Sunday night to Monday morning on loop) -> the usual order as a wobbly
     tower that falls -> the blocks fly into a staircase and turn into Day 1, 2, 3 -> a door marked EXIT 2027 opens
     onto Greek light -> the sunflower climbs in -> The Exit Plan.
     Every frame is a pure function of time: render(t). tools/film/render.js steps it frame by frame into a video. -->

  grain.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .5 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>') + '")';

  function placeBlock(g, x, y, rot, sx, shadowY, lift){
    g.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + sx + ' 1)');
    var d = clamp((shadowY - y - B / 2) / 400, 0, 1);
    g.shadow.setAttribute('cx', x + 10); g.shadow.setAttribute('cy', shadowY + 6);
    g.shadow.setAttribute('rx', 96 * (1 + d * .6)); g.shadow.setAttribute('ry', 15 * (1 + d * .4));
    g.shadow.setAttribute('opacity', (1 - d * .75) * (lift == null ? 1 : lift));
    g.long.setAttribute('cx', x - 70 - d * 40); g.long.setAttribute('cy', shadowY + 8); g.long.setAttribute('rx', 170 * (1 + d * .4)); g.long.setAttribute('ry', 16);
    g.long.setAttribute('opacity', (.55 - d * .4) * (lift == null ? 1 : lift));
  }
  function grad(c1, c2, vertical){
    var k = c1 + c2 + vertical; if (gradCache[k]) return gradCache[k];
    var id = 'bg' + (gradN++), lg = el('linearGradient', {id: id, x1: 0, y1: 0, x2: vertical ? 0 : 1, y2: vertical ? 1 : 0}, defs);
    el('stop', {offset: 0, 'stop-color': c1}, lg); el('stop', {offset: 1, 'stop-color': c2}, lg);
    return (gradCache[k] = 'url(#' + id + ')');
  }
  function shade(hex, f){ var n = parseInt(hex.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
    var m = function(v){ return Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f)) }; return '#' + ((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1) }
  function skin(g, c){
    g.topF.setAttribute('fill', grad(shade(c.top, .25), c.top, false));
    g.sideF.setAttribute('fill', grad(c.side, shade(c.side, -.22), true));
    g.front.setAttribute('fill', grad(shade(c.front, .12), shade(c.front, -.08), true));
    g.icon.innerHTML = iconPath(c.icon);
  }
  function placeRunner(g, x, y, rot, legPhase, legAmp, sq){
    g.setAttribute('transform', 'translate(' + x + ' ' + y + ') rotate(' + rot + ') scale(' + (1 / sq) + ' ' + sq + ')');
    g.legs.forEach(function(L, i){ L.setAttribute('transform', 'translate(' + (i ? 16 : -16) + ' 40) rotate(' + (Math.sin(legPhase + i * Math.PI) * legAmp) + ')') });
  }

  /* =================== render(t): the whole film, as a function of time =================== */
  var DUR = 13.2;
  window.DUR = DUR;
  window.render = function(t){
    /* camera */
    var c = track([[0, [700, 560, 1.16]], [3.2, [740, 560, 1.24]], [4.9, [1260, 540, 1.0]], [7.4, [1660, 520, .9]], [9.4, [1980, 480, 1.02]], [11.2, [2290, 300, 3.4]], [12.4, [2290, 290, 3.6]]], t);
    cam.setAttribute('transform', 'translate(960 540) scale(' + c[2] + ') translate(' + (-c[0]) + ' ' + (-c[1]) + ')');
    leaves.setAttribute('transform', 'translate(' + (Math.sin(t * .5) * 18 + c[0] * .15) + ' ' + (Math.cos(t * .4) * 10) + ')');

    /* the wheel: spinning, then slowing to a stop */
    var spin = t < 3 ? t * 220 : 3 * 220 + 220 * (1 - Math.pow(1 - seg(t, 3, 3.9), 2)) * .45;
    wheel.setAttribute('transform', 'translate(' + W.x + ' ' + W.y + ') rotate(' + spin + ')');
    /* the window: night, morning, night... (the week on repeat), stopping on morning */
    var cyc = t < 3.2 ? (t * .9) % 1 : .5;
    var day = Math.sin(cyc * Math.PI * 2 - Math.PI / 2) * .5 + .5;
    skyN.setAttribute('opacity', 1 - day);
    var ang = (cyc * 360) - 90, ox = Math.cos(ang * Math.PI / 180) * 60, oy = Math.sin(ang * Math.PI / 180) * 60 + 20;
    orb.setAttribute('transform', 'translate(' + ox + ' ' + oy + ')');
    sunO.setAttribute('opacity', day); moonO.setAttribute('opacity', 1 - day);
    monTxt.textContent = day > .5 ? 'MON' : 'SUN';

    /* the sunflower: running in the wheel, then out and over to the tower */
    var run = t < 3 ? 1 : 1 - seg(t, 3, 3.7);
    var legPh = t * 15 * (t < 3 ? 1 : 1 - seg(t, 3, 3.7) * .5);
    var rx, ry, rr = 0, sq = 1;
    if (t < 3.9) { rx = W.x + Math.sin(t * 7) * 4 * run; ry = W.y + W.R - 22 - 104 + Math.abs(Math.sin(legPh)) * -6 * run; rr = 6 * run + (t > 3.5 ? -6 * seg(t, 3.5, 3.9) : 0) }
    else if (t < 4.8) {   /* the hop out: an arc, a little stretch on the way up */
      var p = seg(t, 3.9, 4.8), e = io(p);
      rx = lerp(W.x, 960, e); ry = lerp(W.y + W.R - 126, FLOOR - 104, e) - Math.sin(p * Math.PI) * 300;
      sq = 1 + Math.sin(p * Math.PI) * .06; rr = lerp(-6, 4, e);
    } else if (t < 8.2) { rx = 960; ry = FLOOR - 104 + Math.sin((t - 4.8) * 2.2) * 2; rr = 4 + Math.sin((t - 4.8) * 1.4) * 2; sq = 1 - Math.max(0, .05 - (t - 4.8) * .2) }
    else {   /* up the steps, one hop each, then into the light */
      var hops = [[960, FLOOR - 104], [STEP[0][0] + 10, STEP[0][1] - B / 2 - 104 + 30], [STEP[1][0] + 10, STEP[1][1] - B / 2 - 104 + 30], [STEP[2][0] + 10, STEP[2][1] - B / 2 - 104 + 30], [DOOR.x - 10, DOOR.y - 104 + 30 - 20 + 20], [DOOR.x, DOOR.y - 104]];
      var T0 = 8.2, HD = .62, k = Math.min(Math.floor((t - T0) / HD), hops.length - 2), ph = seg(t, T0 + k * HD, T0 + (k + 1) * HD), ee = io(ph);
      rx = lerp(hops[k][0], hops[k + 1][0], ee); ry = lerp(hops[k][1], hops[k + 1][1], ee) - Math.sin(ph * Math.PI) * 110;
      sq = 1 + Math.sin(ph * Math.PI) * .05 - (ph < .12 ? (.12 - ph) * .5 : 0); rr = Math.sin(ph * Math.PI) * 8;
    }
    var legAmp = t < 3.7 ? 38 * (t < 3 ? 1 : 1 - seg(t, 3, 3.7)) : (t > 8.2 ? 12 : 4);
    if (t >= 3.9 && t < 4.8) legAmp = 24;
    placeRunner(runner, rx, ry, rr, legPh, legAmp, sq);
    var onFloor = t >= 3.9 && t < 8.3;
    runner.shadow.setAttribute('cx', rx + 6); runner.shadow.setAttribute('cy', t < 8.3 ? (t < 3.9 ? W.y + W.R - 18 : FLOOR + 4) : ry + 104 + 16);
    runner.shadow.setAttribute('opacity', t < 3.9 ? .5 : (onFloor ? 1 - clamp((FLOOR - 104 - ry) / 360, 0, .8) : .7));
    var fade = 1 - seg(t, 11.1, 11.6);
    runner.setAttribute('opacity', fade); runner.shadow.setAttribute('opacity', +runner.shadow.getAttribute('opacity') * fade);

    /* the tower: standing, then a growing wobble, then it gives */
    var wob = seg(t, 4.4, 5.6), A = Math.pow(wob, 1.6) * 7 * (t < 5.6 ? 1 : 0);
    var baseY = FLOOR - B / 2;
    tower.forEach(function(g, i){
      var x = TX + Math.sin(t * 6 + i * .5) * A * i * 1.2, y = baseY - i * B, r = Math.sin(t * 6 + i * .5) * A * (.4 + i * .25);
      if (i === 3) {   /* the "?" block falls off the top and lands on its side */
        var f = seg(t, 5.55, 6.35);
        if (f > 0) { var ef = inq(f); x = lerp(x, TX - 190, outq(f)); y = lerp(y, baseY, ef); r = lerp(r, -90, io(f)) }
        if (t > 6.35) { var s2 = seg(t, 6.35, 6.75); y = baseY - Math.sin(s2 * Math.PI) * 14 * (1 - s2); r = -90 + Math.sin(s2 * Math.PI) * 6 * (1 - s2); x = TX - 190 - 12 * outq(s2) }
        g.setAttribute('opacity', 1 - seg(t, 7.4, 8.4) * .55);
        placeBlock(g, x, y, r, 1, FLOOR - 0, 1);
        return;
      }
      /* the other three fly to their steps, turning into Day 1, 2 and 3 on the way */
      var st = 5.75 + (2 - i) * .22 + (i === 0 ? .44 : 0), fp = seg(t, st, st + 1.25);
      if (fp > 0) {
        var target = STEP[i], ex = io(fp);
        x = lerp(x, target[0], ex); y = lerp(y, target[1], settle(fp)) - Math.sin(fp * Math.PI) * (220 - i * 40);
        r = lerp(r, 0, io(fp)) + Math.sin(fp * Math.PI) * (i % 2 ? -14 : 14);
        var flip = Math.abs(Math.cos(seg(fp, .35, .65) * Math.PI)); if (fp > .5) skin(g, NEW[i]); else skin(g, {top: OLD[0], side: OLD[1], front: OLD[2], icon: ['people', 'lock', 'course'][i]});
        placeBlock(g, x, y, r, Math.max(.06, flip), FLOOR, 1);
        dayLbl[i].setAttribute('opacity', seg(t, st + 1.2, st + 1.7));
        return;
      }
      placeBlock(g, x, y, r, 1, FLOOR, 1);
    });

    /* the door: opens onto Greek light, the beam spills down the steps */
    var op = io(seg(t, 7.5, 8.7));
    leaf.setAttribute('transform', 'translate(-80 0) scale(' + lerp(1, .14, op) + ' 1) skewY(' + lerp(0, -9, op) + ') translate(80 0)');
    leafR.setAttribute('fill', op > 0 ? 'rgb(' + Math.round(lerp(255, 222, op)) + ',' + Math.round(lerp(243, 206, op)) + ',' + Math.round(lerp(223, 180, op)) + ')' : '#FFF3DF');
    glow.setAttribute('opacity', op * (1 + seg(t, 10.4, 11.6) * 1.5));
    beam.setAttribute('opacity', op * .9);
    doorSun.setAttribute('cy', -110 + Math.sin(t * .8) * 3);

    document.getElementById('cool').setAttribute('opacity', .16 * (1 - io(seg(t, 3.4, 6.5))));
    document.getElementById('warm').setAttribute('opacity', .55 * io(seg(t, 7.4, 9.6)));
    /* into the light: the screen warms to cream, the title focuses */
    var white = seg(t, 10.6, 11.5);
    document.body.style.background = '#FFF8EE';
    document.getElementById('sv').style.opacity = 1 - io(white);
    var tp = seg(t, 11.0, 12.2);
    spans.forEach(function(s, i){
      var p = clamp((tp * 1.6) - i * .045, 0, 1);
      s.style.opacity = io(p); s.style.filter = 'blur(' + ((1 - io(p)) * 14).toFixed(2) + 'px)';
    });
    ts.style.opacity = io(seg(t, 11.7, 12.3));
    var sfp = io(seg(t, 10.9, 11.8)), tsf = document.getElementById('tsf'); tsf.style.opacity = sfp; tsf.style.filter = 'blur(' + ((1 - sfp) * 16).toFixed(1) + 'px)'; tsf.style.transform = 'rotate(' + ((1 - sfp) * -24).toFixed(1) + 'deg)';
  };

  /* the sunflower's face, from the site's own vector; then ready */
  fetch('../../exit-number/').then(function(r){ return r.text() }).then(function(txt){
    var m = txt.match(/<symbol id="sf" viewBox="-60 -60 120 120">([\s\S]*?)<\/symbol>/); SF = m ? m[1] : '';
  }).catch(function(){}).then(function(){
    runner.head.innerHTML = '<g transform="scale(1.05)">' + SF + '</g>';
    document.getElementById('tsf').innerHTML = '<svg width="170" height="170" viewBox="-60 -60 120 120">' + SF + '</svg>';
    var t0 = +(new URLSearchParams(location.search).get('t') || 0);
    window.render(t0);
    document.fonts.ready.then(function(){ document.body.setAttribute('data-ready', '1') });
  });
})();
</script>
