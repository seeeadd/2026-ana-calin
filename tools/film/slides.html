<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Exit Plan · teaser slides</title>
<!-- Teaser slides for Days 1 to 3 (Nov 1, 2026): the technical slides, not the titles, with the method itself covered.
     Everything you can read comes from the registration copy; the covered bars are what Ana teaches live (she can
     fill them in, or leave them covered). ?s=1a|1b|2a|2b|3a|3b. For the film and the registration page's day cards. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#1A1412;--ink2:#3D332E;--ink3:#7A6A60;--cream:#FFF8EE;--sun:#FFD400;--pink:#F72585;--ysoft:#FFF1B3;--pk3:#FFE1EE;--green:#1f7a45;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
  --sh:0 1px 0 rgba(90,55,25,.10),0 4px 8px -2px rgba(80,45,20,.14),0 24px 44px -18px rgba(80,45,20,.32)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
.slide{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--cream);color:var(--ink);font-family:var(--sans)}
.slide::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.6;pointer-events:none;z-index:0}
.slide>*{position:relative;z-index:1}
/* deck chrome: logo, day, slide number (it should feel like a real deck) */
.top{position:absolute;left:90px;right:90px;top:62px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:26px;letter-spacing:-.02em}
.brand img{width:52px;height:52px}
.day{display:flex;align-items:center;gap:14px;font-weight:800;font-size:18px;letter-spacing:.2em;color:var(--pink)}
.day b{display:inline-grid;place-items:center;height:40px;padding:0 18px;border-radius:999px;background:var(--pink);color:#fff;letter-spacing:.16em}
.foot{position:absolute;left:90px;right:90px;bottom:52px;display:flex;justify-content:space-between;font-weight:700;font-size:17px;letter-spacing:.06em;color:var(--ink3)}
.copy{position:absolute;left:90px;top:200px;width:760px}
.copy h1{font-family:var(--serif);font-weight:400;font-size:80px;line-height:1.02;letter-spacing:-.015em}
.copy p{margin-top:28px;font-size:25px;line-height:1.5;color:var(--ink2);max-width:640px}
.hl{position:relative;white-space:nowrap;isolation:isolate;display:inline-block}
.hl::before{content:"";position:absolute;left:-.1em;right:-.12em;top:.24em;bottom:.04em;background:var(--sun);z-index:-1;border-radius:4px 10px 5px 12px;transform:rotate(-1deg)}
/* the covered parts: black bars like a declassified file, and a lock sticker */
.rd{display:inline-block;height:.82em;border-radius:5px;background:var(--ink);vertical-align:-.08em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.lock{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 20px 12px 14px;border-radius:999px;background:var(--sun);border:2.5px solid var(--ink);box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:19px;letter-spacing:.04em;transform:rotate(-4deg)}
.lock svg{width:24px;height:24px}
.note{position:absolute;padding:26px 28px 30px;background:#FFE15A;border-radius:3px;box-shadow:2px 3px 3px rgba(80,50,0,.18),12px 20px 26px -12px rgba(80,50,0,.4);font-family:var(--serif);font-style:italic;font-size:36px;line-height:1.12;color:#2B2130}
.card{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:22px;box-shadow:var(--sh)}
.k{font-weight:800;font-size:16px;letter-spacing:.16em;color:var(--ink3)}
.pinkpen{position:absolute;overflow:visible;pointer-events:none}
.pinkpen path,.pinkpen ellipse{fill:none;stroke:var(--pink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.hand{font-family:var(--serif);font-style:italic;color:var(--pink)}
</style>
</head>
<body>
<div class="slide" id="s"></div>
<script>
(function(){
  var g = 'url("data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .09 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>') + '")';
  document.documentElement.style.setProperty('--grain', g);
  var LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="#1A1412"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" fill="none" stroke="#1A1412" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var rd = function(w){ return '<span class="rd" style="width:' + w + 'px"></span>' };
  function chrome(day, n, total){
    return '<div class="top"><div class="brand"><img src="../../img/mark.png" alt="">how we grow</div><div class="day"><span>THE EXIT PLAN</span><b>DAY ' + day + '</b></div></div>'
      + '<div class="foot"><span>Ana Calin · How We Grow</span><span>' + n + ' / ' + total + '</span></div>';
  }
  var S = {};

  /* 1a · the two-sale workshop: a real-looking sales dashboard that stays at 2 */
  S['1a'] = function(){
    var pts = [], i; for (i = 0; i <= 30; i++) pts.push((40 + i * 26) + ',' + (300 - (i < 6 ? 0 : i < 19 ? 40 : 80) - Math.sin(i) * 2));
    return chrome(1, 14, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">My first workshop sold</span><br><span style="white-space:nowrap">two copies. Here’s what</span><br><span style="white-space:nowrap"><span class="hl">I didn’t check.</span></span></h1><p>I knew the subject and had done the work. There was something else I should have checked first.</p></div>'
      + '<div class="card" style="left:930px;top:200px;width:880px;height:560px;padding:34px 40px">'
      +   '<div style="display:flex;justify-content:space-between;align-items:center"><span class="k">SALES · MY FIRST WORKSHOP</span><span style="font-weight:700;font-size:16px;color:var(--ink3)">Last 30 days</span></div>'
      +   '<div style="display:flex;gap:56px;margin-top:22px">'
      +     '<div><div style="font-family:var(--serif);font-size:120px;line-height:1">2</div><div style="font-weight:700;font-size:20px;color:var(--ink2)">sales</div></div>'
      +     '<div style="padding-top:18px"><div class="k">VIEWS</div><div style="margin-top:8px">' + rd(130) + '</div><div class="k" style="margin-top:22px">CONVERSION</div><div style="margin-top:8px">' + rd(90) + '</div></div></div>'
      +   '<svg width="800" height="260" viewBox="0 0 830 330" style="position:absolute;left:30px;bottom:40px"><path d="M40 300 H790" stroke="#E7DCCB" stroke-width="3"/><path d="M40 220 H790 M40 140 H790 M40 60 H790" stroke="#F1E9DC" stroke-width="2" stroke-dasharray="6 8"/>'
      +     '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#1A1412" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'
      +     '<circle cx="' + (40 + 6 * 26) + '" cy="260" r="11" fill="#F72585" stroke="#1A1412" stroke-width="3"/><circle cx="' + (40 + 19 * 26) + '" cy="220" r="11" fill="#F72585" stroke="#1A1412" stroke-width="3"/></svg>'
      + '</div>'
      + '<div class="note" style="left:1450px;top:700px;width:400px;transform:rotate(3deg)">What I should have checked first:<div style="margin-top:12px">' + rd(300) + '</div><div style="margin-top:10px">' + rd(220) + '</div></div>'
      + '<div class="lock" style="left:980px;top:830px">' + LOCK + 'Shown live on Day 1</div>';
  };

  /* 1b · first subscribers if nobody knew my name: a map, sources covered */
  S['1b'] = function(){
    var src = [[1180, 300, -4, 260, 180], [1560, 260, 3, 230, 140], [1650, 600, -2, 250, 200]];
    var cards = src.map(function(c, i){
      return '<div class="card" style="left:' + c[0] + 'px;top:' + c[1] + 'px;width:230px;height:190px;padding:22px 24px;transform:rotate(' + c[2] + 'deg)"><div style="width:52px;height:52px;border-radius:50%;background:' + ['#FFD400', '#F72585', '#FFD400'][i] + ';border:2.5px solid #1A1412;display:grid;place-items:center;font-family:var(--serif);font-size:34px;color:' + (i === 1 ? '#fff' : '#1A1412') + '">' + (i + 1) + '</div>'
        + '<div style="margin-top:22px">' + rd(c[3] - 80) + '</div><div style="margin-top:10px">' + rd(c[4] - 60) + '</div></div>';
    }).join('');
    return chrome(1, 9, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">Where I’d find my first</span><br><span style="white-space:nowrap">subscribers if nobody</span><br><span style="white-space:nowrap"><span class="hl">knew my name.</span></span></h1><p>A starting point for finding people who could need what you know, before you commit to months of writing and hoping.</p></div>'
      + '<svg class="pinkpen" width="1920" height="1080" style="left:0;top:0"><path d="M1090 600 C 1120 520, 1150 470, 1200 420" stroke-dasharray="2 14"/><path d="M1130 560 C 1300 420, 1450 380, 1560 360" stroke-dasharray="2 14"/><path d="M1140 640 C 1350 690, 1500 700, 1650 690" stroke-dasharray="2 14"/></svg>'
      + '<div style="position:absolute;left:930px;top:560px;width:210px;height:210px;border-radius:50%;background:#fff;border:3px solid #1A1412;box-shadow:var(--sh);display:grid;place-items:center;text-align:center">'
      +   '<div><div style="font-family:var(--serif);font-size:56px;line-height:1">You</div><div style="margin-top:6px;font-weight:800;font-size:17px;letter-spacing:.06em;color:var(--ink3)">0 subscribers</div></div></div>'
      + cards
      + '<div class="lock" style="left:1250px;top:860px">' + LOCK + 'The three places, on Day 1</div>';
  };

  /* 2a · four words for "your best price": an email thread, the reply covered */
  S['2a'] = function(){
    return chrome(2, 21, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">Four words, when</span><br><span style="white-space:nowrap">a client asked for</span><br><span style="white-space:nowrap"><span class="hl">my best price.</span></span></h1><p>They accepted. I’ll show you the exchange, and what matters about it when you’re naming your own number.</p></div>'
      + '<div class="card" style="left:930px;top:190px;width:880px;height:680px;padding:0;overflow:hidden">'
      +   '<div style="height:70px;border-bottom:2px solid #EFE6D8;display:flex;align-items:center;gap:12px;padding:0 30px"><span style="width:14px;height:14px;border-radius:50%;background:#F72585"></span><span style="width:14px;height:14px;border-radius:50%;background:#FFD400"></span><span style="width:14px;height:14px;border-radius:50%;background:#E7DCCB"></span><span style="margin-left:18px;font-weight:800;font-size:19px">Re: working together</span></div>'
      +   '<div style="padding:34px 40px">'
      +     '<div style="display:flex;gap:16px;align-items:flex-start"><div style="flex:none;width:54px;height:54px;border-radius:50%;background:#E7DCCB;border:2px solid #1A1412"></div><div><div style="font-weight:800;font-size:19px">A client <span style="font-weight:600;color:var(--ink3)">· 9:14</span></div><div style="margin-top:12px;padding:20px 24px;border-radius:4px 18px 18px 18px;background:#F6EFE4;font-size:27px;line-height:1.4">Before I say yes, what’s your best price?</div></div></div>'
      +     '<div style="display:flex;gap:16px;align-items:flex-start;margin-top:40px;flex-direction:row-reverse"><img src="../../img/mark.png" style="flex:none;width:54px;height:54px"><div style="text-align:right"><div style="font-weight:800;font-size:19px">Ana <span style="font-weight:600;color:var(--ink3)">· 9:20</span></div><div style="margin-top:12px;padding:22px 26px;border-radius:18px 4px 18px 18px;background:#FFE1EE;font-size:30px;line-height:1.3;display:inline-flex;gap:12px">' + rd(96) + rd(70) + rd(120) + rd(88) + '</div></div></div>'
      +     '<div style="display:flex;gap:16px;align-items:flex-start;margin-top:40px"><div style="flex:none;width:54px;height:54px;border-radius:50%;background:#E7DCCB;border:2px solid #1A1412"></div><div><div style="font-weight:800;font-size:19px">A client <span style="font-weight:600;color:var(--ink3)">· 9:41</span></div><div style="margin-top:12px;padding:16px 22px;border-radius:4px 18px 18px 18px;background:#F6EFE4;font-size:27px;display:inline-flex;align-items:center;gap:12px"><span style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#1f7a45;color:#fff;font-weight:800;font-size:20px">✓</span>Accepted</div></div></div>'
      +   '</div></div>'
      + '<div class="hand" style="position:absolute;left:1180px;top:560px;font-size:44px;transform:rotate(-5deg)">four words</div>'
      + '<svg class="pinkpen" width="400" height="200" style="left:1380px;top:430px"><path d="M10 150 C 60 110, 110 80, 170 70 M150 54 l22 16 l-24 12"/></svg>'
      + '<div class="lock" style="left:980px;top:900px">' + LOCK + 'The four words, live on Day 2</div>';
  };

  /* 2b · the pricing check: a checklist with every item covered, and the price ruler */
  S['2b'] = function(){
    var rows = [300, 380, 250, 340, 280].map(function(w, i){
      return '<div style="display:flex;align-items:center;gap:20px;padding:20px 0;border-bottom:2px dashed #EFE6D8"><span style="flex:none;width:38px;height:38px;border-radius:9px;border:3px solid #1A1412;background:' + (i < 2 ? '#FFD400' : '#fff') + ';display:grid;place-items:center;font-weight:800;font-size:22px">' + (i < 2 ? '✓' : '') + '</span><span style="font-family:var(--serif);font-size:30px;color:var(--ink3)">' + (i + 1) + '</span>' + rd(w) + '</div>';
    }).join('');
    return chrome(2, 26, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">The pricing check I use</span><br><span style="white-space:nowrap"><span class="hl">before anything</span></span><br><span style="white-space:nowrap">goes on sale.</span></h1><p>So your number has something behind it beyond “I hope nobody thinks that’s too much.”</p></div>'
      + '<div class="card" style="left:930px;top:180px;width:560px;height:620px;padding:30px 40px;transform:rotate(-1.5deg)"><div class="k">THE PRICING CHECK</div><div style="margin-top:8px">' + rows + '</div></div>'
      + '<div class="card" style="left:1340px;top:560px;width:480px;height:330px;padding:28px 32px;transform:rotate(2deg);background:#FFFDF8">'
      +   '<div class="k">WHERE YOUR NUMBER COMES FROM</div>'
      +   '<svg width="420" height="200" viewBox="0 0 420 200" style="margin-top:14px"><path d="M10 120 H410" stroke="#1A1412" stroke-width="5" stroke-linecap="round"/>'
      +   (function(){ var s = ''; for (var i = 0; i <= 20; i++) s += '<path d="M' + (10 + i * 20) + ' ' + (i % 5 ? 110 : 98) + ' V120" stroke="#1A1412" stroke-width="3"/>'; return s })()
      +   '<g transform="translate(96 120)"><path d="M0 0 v-60" stroke="#7A6A60" stroke-width="3" stroke-dasharray="4 6"/><circle r="12" fill="#E7DCCB" stroke="#1A1412" stroke-width="3"/><path d="M-60 -98 l120 70 M60 -98 l-120 70" stroke="#F72585" stroke-width="5" stroke-linecap="round" opacity=".85"/></g>'
      +   '<g transform="translate(330 120)"><path d="M0 0 v-60" stroke="#1A1412" stroke-width="3"/><circle r="15" fill="#FFD400" stroke="#1A1412" stroke-width="4"/></g>'
      +   '<text x="10" y="170" font-family="Instrument Serif" font-style="italic" font-size="22" fill="#7A6A60">“hope nobody minds”</text><text x="330" y="170" text-anchor="middle" font-family="Instrument Serif" font-style="italic" font-size="22" fill="#1A1412">something behind it</text></svg></div>'
      + '<div class="lock" style="left:980px;top:860px">' + LOCK + 'All five, on Day 2</div>';
  };

  /* 3a · 771 likes made nothing, 82 made money: two posts, the second one's earnings covered */
  S['3a'] = function(){
    function post(x, y, r, likes, earned, wide){
      return '<div class="card" style="left:' + x + 'px;top:' + y + 'px;width:420px;height:560px;padding:0;overflow:hidden;transform:rotate(' + r + 'deg)">'
        + '<div style="height:200px;background:' + (wide ? 'linear-gradient(135deg,#FFE1EE,#FFF1B3)' : '#F1E9DC') + ';border-bottom:2px solid #1A1412;display:grid;place-items:center">' + rd(160) + '</div>'
        + '<div style="padding:24px 28px"><div>' + rd(330) + '</div><div style="margin-top:12px">' + rd(250) + '</div><div style="margin-top:12px">' + rd(290) + '</div>'
        + '<div style="display:flex;align-items:center;gap:10px;margin-top:30px;font-weight:800;font-size:30px"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21Z" fill="#F72585"/></svg>' + likes + ' likes</div>'
        + '<div style="margin-top:18px;padding-top:18px;border-top:2px dashed #EFE6D8;display:flex;justify-content:space-between;align-items:center"><span class="k">EARNED</span><span style="font-family:var(--serif);font-size:48px">' + earned + '</span></div></div></div>';
    }
    return chrome(3, 33, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">771 likes made nothing.</span><br><span style="white-space:nowrap"><span class="hl">82 likes made money.</span></span></h1><p>I’ll show you both. The difference matters much more than which one looked successful.</p></div>'
      + post(930, 210, -3, '771', '$0', false)
      + post(1390, 190, 2.5, '82', rd(130), true)
      + '<svg class="pinkpen" width="600" height="300" style="left:1240px;top:700px"><path d="M40 60 C 120 160, 300 170, 420 70 M398 58 l26 10 l-14 26"/></svg>'
      + '<div class="hand" style="position:absolute;left:1300px;top:880px;font-size:42px;transform:rotate(-3deg)">the difference: <span class="rd" style="width:200px;background:#F72585"></span></div>';
  };

  /* 3b · one offer to 300 readers: a field of dots, the 300 picked out */
  S['3b'] = function(){
    var dots = '', s = 3, r = function(){ s = (s * 9301 + 49297) % 233280; return s / 233280 };
    for (var i = 0; i < 46; i++) for (var j = 0; j < 26; j++) {
      var x = 20 + i * 18 + (j % 2) * 9, y = 20 + j * 18, d = Math.hypot(x - 560, y - 250), pick = d < 120 && r() < .62;
      dots += '<circle cx="' + x + '" cy="' + y + '" r="' + (pick ? 6.5 : 5) + '" fill="' + (pick ? '#F72585' : '#E2D5C2') + '"' + (pick ? ' stroke="#1A1412" stroke-width="1.6"' : '') + '/>';
    }
    return chrome(3, 37, 52)
      + '<div class="copy"><h1><span style="white-space:nowrap">Why I sent one offer</span><br><span style="white-space:nowrap">to <span class="hl">300 readers,</span></span><br><span style="white-space:nowrap">not my whole list.</span></h1><p>The decision behind it, and what it means when you choose who should hear about yours.</p></div>'
      + '<div class="card" style="left:930px;top:210px;width:880px;height:560px;padding:28px 30px">'
      +   '<div style="display:flex;justify-content:space-between"><span class="k">MY NEWSLETTER</span><span class="k" style="color:var(--pink)">● THE 300</span></div>'
      +   '<svg width="830" height="480" viewBox="0 0 860 490" style="margin-top:6px">' + dots + '<ellipse cx="560" cy="250" rx="140" ry="128" fill="none" stroke="#F72585" stroke-width="6" stroke-dasharray="3 12" stroke-linecap="round"/></svg></div>'
      + '<div class="note" style="left:1000px;top:700px;width:470px;transform:rotate(-3deg)">Who I chose, and why:<div style="margin-top:12px">' + rd(320) + '</div><div style="margin-top:10px">' + rd(240) + '</div></div>'
      + '<div class="lock" style="left:1530px;top:860px">' + LOCK + 'Day 3</div>';
  };

  var k = new URLSearchParams(location.search).get('s') || '1a';
  document.getElementById('s').innerHTML = (S[k] || S['1a'])();
  document.fonts.ready.then(function(){ setTimeout(function(){ document.body.setAttribute('data-ready', '1') }, 200) });
})();
</script>
</body>
</html>
