<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 3 · One offer to 300 readers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Manrope:wght@600;700;800&family=Nothing+You+Could+Do&display=swap">
<link rel="stylesheet" href="deck.css?v=2">
<style>
/* Day 3, slide 2 · the field. Her whole list as envelopes you can count (Jason: make the number countable); 300 of
   them turn pink, lift out and fly into one envelope, which gets her postmark. The rest of the list stays where it
   is. Layout: a full field of small things with a clearing for the headline. */
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2}
.wm{left:96px;top:118px;z-index:5}
.type{z-index:5}
.big{position:absolute;left:1270px;top:560px;width:540px;z-index:4}
.big img{width:100%;height:auto}
.pm{position:absolute;left:1360px;top:770px;width:330px;z-index:6;transform:rotate(-9deg);mix-blend-mode:multiply}
.pm img{width:100%;height:auto}
</style></head>
<body>
<div class="stage">
  <canvas id="cv" width="3840" height="2160"></canvas>
  <div class="wm"><img src="../img/mark.png" alt=""><b>how we grow</b></div>
  <div class="type"><p class="mk">Day 3<i>·</i>The Exit Plan</p>
    <h1 class="hl" id="hA"><span class="ln">Why I sent</span><span class="ln">one offer to</span><span class="ln key">300 readers</span></h1></div>
  <div class="big" id="big"><img src="../img/vip/paint/env.webp" alt=""></div>
  <div class="pm" id="pm"><img src="../img/vip/paint/dk-postmark.webp" alt=""></div>
  <svg class="grain" viewBox="0 0 1920 1080" preserveAspectRatio="none"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" filter="url(#gr)"/></svg>
</div>
<script src="../assets/vendor/gsap.min.js"></script>
<script src="deck.js?v=2"></script>
<script>
DECK.start(function (D) {
  var $ = D.$, $$ = D.$$, hA = $('#hA');
  D.setHeadline(hA, { width: 800, top: 330, max: 160 }); $('.mk').style.top = '262px';
  var cv = $('#cv'), ctx = cv.getContext('2d'); ctx.scale(2, 2);
  /* the list: a grid of small envelopes, leaving a clearing for the headline and the big envelope */
  var E = [], s = 7, rnd = function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646 };
  for (var y = 40; y < 1060; y += 30) for (var x = 28; x < 1900; x += 36) {
    var jx = x + (rnd() - .5) * 8, jy = y + (rnd() - .5) * 6;
    if (jx < 1010 && jy > 90 && jy < 840) continue;           /* the headline's clearing */
    if (jx > 1240 && jy > 540) continue;                      /* the big envelope's corner */
    E.push({ x: jx, y: jy, r: (rnd() - .5) * .5, pink: 0, fly: 0, d: 0 });
  }
  /* her 300: the ones nearest a point in the field, with a little noise so the group looks chosen, not cut */
  var cx = 1460, cy = 300; E.forEach(function (e) { e.d = Math.hypot(e.x - cx, (e.y - cy) * 1.25) + rnd() * 60 });
  var sorted = E.slice().sort(function (a, b) { return a.d - b.d }), P = sorted.slice(0, 300); P.forEach(function (e, i) { e.sel = 1; e.k = i });
  var maxD = P[P.length - 1].d, T = { show: 0, ripple: 0, fly: 0 }, TGT = { x: 1545, y: 690 };
  function env(x, y, r, sc, fill, stroke) { ctx.save(); ctx.translate(x, y); ctx.rotate(r); ctx.scale(sc, sc);
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.rect(-12, -8, 24, 16); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(0, 1.5); ctx.lineTo(12, -8); ctx.stroke(); ctx.restore() }
  function render() { ctx.clearRect(0, 0, 1920, 1080);
    E.forEach(function (e) {
      var appear = Math.min(1, Math.max(0, T.show * 2400 - e.x - e.y * .4) / 260); if (appear <= 0) return;
      var pk = e.sel ? Math.min(1, Math.max(0, (T.ripple * (maxD + 120) - e.d) / 120)) : 0;
      var f = e.sel ? Math.min(1, Math.max(0, T.fly * 1.6 - e.k / 300 * .6)) : 0;
      if (f >= 1) return;
      var ef = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      var x = e.x + (TGT.x - e.x) * ef, y = e.y + (TGT.y - e.y) * ef - Math.sin(Math.PI * ef) * 140, sc = (.6 + .4 * appear) * (1 + .25 * pk - .5 * ef);
      var fill = pk ? 'rgb(' + Math.round(255 - 6 * pk) + ',' + Math.round(251 - 69 * pk) + ',' + Math.round(243 - 33 * pk) + ')' : '#FFFBF3';
      var stroke = pk ? 'rgba(224,36,122,' + (.35 + .6 * pk) + ')' : 'rgba(58,42,34,.32)';
      ctx.globalAlpha = appear; env(x, y, e.r + ef * 2.2, sc, fill, stroke); ctx.globalAlpha = 1 });
  }
  render();
  var A = gsap.timeline({ onUpdate: render });
  if (!D.still) gsap.set(['.wm', '.mk', '#big', '#pm'].concat($$('.w', hA)), { opacity: 0 });
  A.add(function () { D.emit('talk') }, 0);
  A.fromTo(T, { show: 0 }, { show: 1.2, duration: 2.2, ease: 'power1.inOut', onUpdate: render, immediateRender: false }, 0);
  A.fromTo('.wm, .mk', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .4, stagger: .1, immediateRender: false }, .3);
  D.wordsIn(A, hA, .5); D.swipeIn(A, hA, 1.6);
  /* her pick: pink spreads through the 300 from the middle out */
  A.fromTo(T, { ripple: 0 }, { ripple: 1, duration: 1.4, ease: 'power1.out', onUpdate: render, immediateRender: false }, 2.3);
  D.placeIn(A, '#big', 3.2, { y: 60, rot: -6, dur: .7 });
  /* the 300 lift and fly into the one envelope, a few at a time, on arcs */
  A.fromTo(T, { fly: 0 }, { fly: 1, duration: 2.6, ease: 'none', onUpdate: render, immediateRender: false }, 3.9);
  A.fromTo('#big', { scale: 1 }, { keyframes: { scale: [1.03, 1, 1.03, 1] }, duration: 2.4, ease: 'none', immediateRender: false }, 4.1);
  /* her postmark lands on it */
  A.fromTo('#pm', { opacity: 0, scale: 1.8, rotation: -30 }, { opacity: 1, scale: 1, rotation: -9, duration: .3, ease: 'power4.in', immediateRender: false }, 6.6)
   .fromTo('#big', { y: 0 }, { keyframes: { y: [5, 0] }, duration: .2, immediateRender: false }, '>');
  A.add(function () { D.emit('quiet') });
  return { A: A };
});
</script>
</body></html>
